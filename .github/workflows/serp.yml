name: batch
on:
  workflow_dispatch:
    inputs:
      queries:
        description: JSON array of query strings
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: batch-${{ github.run_id }}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Cache playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-webkit-${{ runner.os }}-1
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps webkit
      - run: node runner.js
        env:
          QUERIES_JSON: ${{ inputs.queries }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: results
          path: results.json
          retention-days: 1
